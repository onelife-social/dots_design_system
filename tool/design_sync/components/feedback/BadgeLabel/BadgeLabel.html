<!doctype html>

  <div class="ds-grid" id="g"></div>

  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.BadgeLabel;
    function row() {
      var kids = Array.prototype.slice.call(arguments);
      return h.apply(null, ['div', { style: { display: 'flex', alignItems: 'center', gap: '10px', flexWrap: 'wrap' } }].concat(kids));
    }
    var variants = [
      ['sizes · main', row(

        h(C, { content: 'medium 22' }),
        h(C, { content: 'small 18', size: 'small' })
      )],
      ['main / secondary', row(

        h(C, { content: 'secondary', variant: 'secondary' })
      )],
      ['green / greenMaterial', row(
        h(C, { content: 'green', variant: 'green' }),
        h(C, { content: 'greenMaterial', variant: 'greenMaterial' })
      )],
      ['white', row(h(C, { content: 'white', variant: 'white' }))],
      ['warning / warningMaterial', row(

        h(C, { content: 'warningMaterial', variant: 'warningMaterial' })
      )],
