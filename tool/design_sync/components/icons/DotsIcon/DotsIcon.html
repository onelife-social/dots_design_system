<!-- @dsCard group="icons" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../_ds_bundle.css">
  <style>
    body{margin:0;padding:24px;background:var(--bg-base)}
    .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
    .ds-cell{border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-width:0;overflow:hidden;transform:translateZ(0)}
    .ds-cell>h4{margin:0 0 8px;font:600 12px system-ui;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
    .ds-cell--wide{grid-column:1/-1}
  </style>
</head><body>
  <div class="ds-grid" id="g"></div>
  <script src="../../../_vendor/react.js"></script>
  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.DotsIcon;

    // catálogo: rejilla con TODOS los iconos incluidos, nombre debajo
    function Catalog() {
      return h('div', {
        style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(72px,1fr))', gap: 12 },
      }, C.names.map(function (n) {
        return h('div', {
          key: n,
          style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, color: 'var(--label-primary)' },
        },
          h(C, { name: n, size: 24 }),
          h('span', {
            style: { font: '9px system-ui', color: 'var(--label-secondary)', textAlign: 'center', wordBreak: 'break-all' },
          }, n));
      }));
    }

    // tamaños
    function Sizes() {
      return h('div', { style: { display: 'flex', alignItems: 'flex-end', gap: 16, color: 'var(--label-primary)' } },
        [16, 20, 24, 32].map(function (s) {
          return h('div', { key: s, style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 } },
            h(C, { name: 'ic-heart', size: s }),
            h('span', { style: { font: '9px system-ui', color: 'var(--label-secondary)' } }, s + 'px'));
        }));
    }

    // color: currentColor heredado + tokens
    function Colors() {
      return h('div', { style: { display: 'flex', alignItems: 'center', gap: 16 } },
        h('div', { style: { color: 'var(--label-primary)', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 } },
          h(C, { name: 'ic-heart', size: 24 }),
          h('span', { style: { font: '9px system-ui', color: 'var(--label-secondary)' } }, 'currentColor')),
        h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 } },
          h(C, { name: 'ic-heart', size: 24, color: 'var(--label-highlight)' }),
          h('span', { style: { font: '9px system-ui', color: 'var(--label-secondary)' } }, '--label-highlight')),
        h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 } },
          h(C, { name: 'ic-heart', size: 24, color: 'var(--label-destructive)' }),
          h('span', { style: { font: '9px system-ui', color: 'var(--label-secondary)' } }, '--label-destructive')));
    }

    var variants = [
      ['catálogo (' + C.names.length + ' iconos)', h(Catalog), true],
      ['tamaños (16 / 20 / 24 / 32)', h(Sizes)],
      ['color', h(Colors)]
    ];
    var g = document.getElementById('g');
    variants.forEach(function (v) {
      var cell = document.createElement('div'); cell.className = 'ds-cell' + (v[2] ? ' ds-cell--wide' : '');
      var t = document.createElement('h4'); t.textContent = v[0]; cell.appendChild(t);
      var m = document.createElement('div'); cell.appendChild(m); g.appendChild(cell);
      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
  </script>
</body></html>
