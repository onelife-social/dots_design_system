<!-- @dsCard group="cards" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../_ds_bundle.css">
  <style>
    body{margin:0;padding:24px;background:var(--bg-base)}
    .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
    .ds-cell{border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-width:0;overflow:hidden;transform:translateZ(0)}
    .ds-cell>h4{margin:0 0 8px;font:600 12px system-ui;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
  </style>
</head><body>
  <div class="ds-grid" id="g"></div>
  <script src="../../../_vendor/react.js"></script>
  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.RecapCard;
    function row() {
      return h('div', { style: { display: 'flex', gap: '16px', flexWrap: 'wrap', alignItems: 'flex-start' } },
        Array.prototype.slice.call(arguments));
    }
    var future = new Date(Date.now() + 2 * 864e5 + 11 * 36e5 + 36 * 6e4 + 54e3).toISOString();
    var variants = [
      ['active · badge premium + botón', h(C, {
        variant: 'active', title: 'Recap 2025', badgeText: 'Premium', buttonText: 'Ver recap'
      })],
      ['blocked · imagen blur + lock', h(C, {
        variant: 'blocked', title: 'Recap 2025', buttonText: 'Desbloquear'
      })],
      ['generated · share + createdBy', h(C, {
        variant: 'generated', title: 'Recap 2025', albumName: 'Verano en familia', createdBy: 'Creado por Ana'
      })],
      ['onlyTitle', h(C, { variant: 'onlyTitle' })],
      ['locked · countdown (CountdownRecap)', h(C, {
        locked: true, lockedVariant: 'countdown', title: 'Recap de agosto',
        countdownDate: future, daysLabel: 'días', hoursLabel: 'h', minutesLabel: 'min', secondsLabel: 'seg'
      })],
      ['locked · locked (blur + botón gallery)', h(C, {
        locked: true, lockedVariant: 'locked', blurImage: true, title: 'Recap bloqueado',
        description: 'Añade más fotos para desbloquearlo', buttonText: 'Añadir fotos'
      })],
      ['locked · soon (sin botón info)', h(C, {
        locked: true, lockedVariant: 'soon', title: 'Muy pronto', description: 'Tu recap está en camino'
      })],
      ['dark', row(
        h(C, { variant: 'active', title: 'Recap 2025', badgeText: 'Premium', buttonText: 'Ver recap', width: 200 }),
        h(C, { locked: true, lockedVariant: 'locked', blurImage: true, title: 'Recap bloqueado', description: 'Añade más fotos', buttonText: 'Añadir fotos', width: 200 })
      ), true]
    ];
    var g = document.getElementById('g');
    variants.forEach(function (v) {
      var cell = document.createElement('div'); cell.className = 'ds-cell';
      var t = document.createElement('h4'); t.textContent = v[0]; cell.appendChild(t);
      var m = document.createElement('div'); cell.appendChild(m); g.appendChild(cell);
      if (v[2]) {
        m.setAttribute('data-theme', 'dark');
        m.style.background = 'var(--bg-base)';
        m.style.padding = '12px';
        m.style.borderRadius = '6px';
      }
      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
  </script>
</body></html>
