<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../_ds_bundle.css">
  <style>
    body{margin:0;padding:24px;background:var(--bg-base)}
    .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
    .ds-cell{border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-width:0;overflow:hidden;transform:translateZ(0)}
    .ds-cell>h4{margin:0 0 8px;font:600 12px system-ui;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
  </style>
</head><body>
  <div class="ds-grid" id="g"></div>
  <script src="../../../_vendor/react.js"></script>
  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.NotificationBannerImage;
    function demoImg(a, b, w, hgt) {
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + hgt + '">' +
        '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="' + a + '"/><stop offset="1" stop-color="' + b + '"/></linearGradient></defs>' +
        '<rect width="' + w + '" height="' + hgt + '" rx="16" fill="url(#g)"/></svg>');
    }
    var variants = [
      ['home recap — sin src (placeholder) + main large', h(C, {
        title: '¡Revive tus mejores recuerdos en vídeo! Descubre uno nuevo cada vez.',
        actionButtonText: 'Elegir mi álbum',
        actionButtonSize: 'large',
        onActionClick: function () {},
      })],
      ['src + imageSize 88 + description + appendedDescription', h(C, {
        src: demoImg('#EF5FC1', '#15ABF3', 176, 176),
        imageSize: 88,
        title: 'Tu recap de agosto está listo',
        description: 'Un vídeo con tus mejores momentos.',
        appendedDescription: 'Ver ahora',
        actionButtonText: 'Reproducir',
      })],
      ['isBtnActive: false · showCloseButton: false', h(C, {
        src: demoImg('#C982F7', '#F5784D', 560, 176),
        title: 'Recap disponible pronto',
        description: 'Sigue subiendo fotos para desbloquearlo.',
        actionButtonText: 'Aún no disponible',
        isBtnActive: false,
        showCloseButton: false,
      })],
      ['dark — home recap', h(C, {
        title: '¡Revive tus mejores recuerdos en vídeo! Descubre uno nuevo cada vez.',
        actionButtonText: 'Elegir mi álbum',
        actionButtonSize: 'large',
      }), true],
    ];
    var g = document.getElementById('g');
    variants.forEach(function (v) {
      var cell = document.createElement('div'); cell.className = 'ds-cell';
      var t = document.createElement('h4'); t.textContent = v[0]; cell.appendChild(t);
      var m = document.createElement('div');
      if (v[2]) { m.setAttribute('data-theme', 'dark'); m.style.background = 'var(--bg-base)'; m.style.padding = '12px'; m.style.borderRadius = '6px'; }
      cell.appendChild(m); g.appendChild(cell);
      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
  </script>
</body></html>
