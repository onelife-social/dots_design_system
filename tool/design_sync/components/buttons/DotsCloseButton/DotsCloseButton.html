  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.DotsCloseButton;
    function row() {

      return h.apply(null, ['div', { style: { display: 'flex', gap: '12px', alignItems: 'center', flexWrap: 'wrap' } }].concat(kids));
    }
