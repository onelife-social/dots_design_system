<!-- @dsCard group="indicators" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../_ds_bundle.css">
  <style>
    body{margin:0;padding:24px;background:var(--bg-base)}
    .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
    .ds-cell{border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-width:0;overflow:hidden;transform:translateZ(0)}
    .ds-cell>h4{margin:0 0 8px;font:600 12px system-ui;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
    .map{position:relative;height:140px;border-radius:16px;background:var(--bg-container-secondary-on-bg);overflow:hidden}
    /* Crosshair on the coordinate: the pin's box is anchored by its bottom centre, moved down to its tip */
    .map__h,.map__v{position:absolute;background:var(--label-destructive);opacity:.5}
    .map__h{left:0;right:0;top:100px;height:1px}
    .map__v{top:0;bottom:0;left:50%;width:1px}
    .map__pin{position:absolute;left:50%;top:100px;transform:translate(-50%,-100%)}
  </style>
</head><body>
  <div class="ds-grid" id="g"></div>
  <script src="../../../_vendor/react.js"></script>
  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.DotsMapPin;
    function onMap() {
      return h('div', { className: 'map' },
        h('div', { className: 'map__h' }), h('div', { className: 'map__v' }),
        h('div', { className: 'map__pin' }, h(C, { ariaLabel: 'Finca El Olivar', style: { transform: 'translateY(3.46px)' } })));
    }
    var variants = [
      ['default (46 × 55)', h(C, {})],
      ['ancla: la punta en la coordenada', onMap()],
      ['dark', h(C, {}), true],
      ['dark sobre el mapa', onMap(), true]
    ];
    var g = document.getElementById('g');
    variants.forEach(function (v) {
      var cell = document.createElement('div'); cell.className = 'ds-cell';
      var t = document.createElement('h4'); t.textContent = v[0]; cell.appendChild(t);
      var m = document.createElement('div'); cell.appendChild(m); g.appendChild(cell);
      if (v[2]) {
        m.setAttribute('data-theme', 'dark');
        m.style.background = 'var(--bg-base)';
        m.style.padding = '12px';
        m.style.borderRadius = '6px';
      }
      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
  </script>
</body></html>
