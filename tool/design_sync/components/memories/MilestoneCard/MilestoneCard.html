  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.MilestoneCard;
    // Foto de ejemplo generada localmente (sin dependencias externas)
    var demoSrc = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400">' +
      '<defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#C9D6C3"/><stop offset=".5" stop-color="#E4D6BE"/>' +
      '<stop offset="1" stop-color="#A9B7C0"/></linearGradient></defs>' +
      '<rect width="300" height="400" fill="url(#a)"/>' +
      '<circle cx="90" cy="290" r="60" fill="#FFFFFF55"/>' +
      '<circle cx="210" cy="150" r="90" fill="#FFFFFF33"/></svg>');
    var row = function () {
      return h('div', { style: { display: 'flex', gap: '14px', alignItems: 'flex-start', flexWrap: 'wrap' } },
        Array.prototype.slice.call(arguments));
    };
    var variants = [
      ['big (width 170 > 150 · r32) · title + date', h(C, {
        width: 170, src: demoSrc, title: 'Primeros pasos', date: '12 mar 2026'
      })],
      ['completa · showBadge + showEdit + badgeTypes ×3', h(C, {
        width: 170, src: demoSrc, title: 'Primeros pasos', date: '12 mar 2026',
        showBadge: true, showEdit: true, badgeTypes: ['video', 'description', 'audio']
      })],
      ['small (width 120 · r24) · sin title (sin blur) / con title', row(
        h(C, { width: 120, src: demoSrc }),
        h(C, { width: 120, src: demoSrc, title: 'Su primer diente' })
      )],
      ['limitTitle (1 línea + ellipsis) · badgeTypes ×2', h(C, {
        width: 170, src: demoSrc, limitTitle: true,
        title: 'Un título larguísimo que no cabe en la tarjeta',
        badgeTypes: ['video', 'audio']
      })],
      ['sin src (placeholder defaultImage) · badgeTypes ×1', h(C, {
        width: 170, title: 'Gatea por primera vez', badgeTypes: ['description']
      })],

        width: 170, src: demoSrc, title: 'Primeros pasos', date: '12 mar 2026',
        showBadge: true, showEdit: true, badgeTypes: ['video', 'description', 'audio']

      var m = document.createElement('div'); cell.appendChild(m); g.appendChild(cell);

      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
