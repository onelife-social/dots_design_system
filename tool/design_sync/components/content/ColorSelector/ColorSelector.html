<!-- @dsCard group="content" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../_ds_bundle.css">
  <style>
    body{margin:0;padding:24px;background:var(--bg-base)}
    .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
    .ds-cell{border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-width:0;overflow:hidden;transform:translateZ(0)}
    .ds-cell>h4{margin:0 0 8px;font:600 12px system-ui;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
  </style>
</head><body>
  <div class="ds-grid" id="g"></div>
  <script src="../../../_vendor/react.js"></script>
  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.ColorSelector;
    // Demo interactiva: estado de selección real
    function Demo(props) {
      var st = React.useState(props.initial);
      return h(C, Object.assign({}, props.rest, { selected: st[0], onColorSelected: st[1] }));
    }
    var variants = [
      ['options · paleta DotsColorOption (32 · spacing 18)',
        h(Demo, { initial: 'friends002', rest: {} })],
      ['options · subset custom · size 24 · spacing 10',
        h(Demo, { initial: 'hobby001', rest: { colors: ['couple007', 'class005', 'family001', 'child002', 'hobby001', 'work005'], size: 24, spacing: 10 } })],
      ['selector · colores libres (32 · spacing 12)',
        h(Demo, { initial: '#E55451', rest: { variant: 'selector', colors: ['#E55451', '#F4BD24', '#569AF8', '#77D98A', '#B175B1'] } })],
      ['selector · sin selección',
        h(C, { variant: 'selector', colors: ['#E55451', '#F4BD24', '#569AF8', '#77D98A', '#B175B1'] })],
      ['dark', h('div', null,
        h(Demo, { initial: 'textQuarternary', rest: {} }),
        h('div', { style: { height: '12px' } }),
        h(Demo, { initial: '#F4BD24', rest: { variant: 'selector', colors: ['#E55451', '#F4BD24', '#569AF8', '#77D98A', '#B175B1'] } })
      ), true]
    ];
    var g = document.getElementById('g');
    variants.forEach(function (v) {
      var cell = document.createElement('div'); cell.className = 'ds-cell';
      var t = document.createElement('h4'); t.textContent = v[0]; cell.appendChild(t);
      var m = document.createElement('div'); cell.appendChild(m); g.appendChild(cell);
      if (v[2]) {
        m.setAttribute('data-theme', 'dark');
        m.style.background = 'var(--bg-base)';
        m.style.padding = '12px';
        m.style.borderRadius = '6px';
      }
      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
  </script>
</body></html>
