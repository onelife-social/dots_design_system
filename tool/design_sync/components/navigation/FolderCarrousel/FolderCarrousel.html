<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../_ds_bundle.css">
  <style>
    body{margin:0;padding:24px;background:var(--bg-base)}
    .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;align-items:start}
    .ds-cell{border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-width:0;overflow:hidden;transform:translateZ(0)}
    .ds-cell>h4{margin:0 0 8px;font:600 12px system-ui;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
    .phone{max-width:340px;border-radius:14px;overflow:hidden;outline:1px solid #BCBCBC7F;background:var(--bg-base);padding:10px 0}
    [data-theme="dark"] .phone{outline-color:#BCBCBC33}
  </style>
</head><body>
  <div class="ds-grid" id="g"></div>
  <script src="../../../_vendor/react.js"></script>
  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.FolderCarrousel;
    function phone(el) { return h('div', { className: 'phone' }, el); }
    function noop() {}
    // Los MISMOS iconos reales del home (screens/home.html)
    var homeItems = [
      { icon: 'ic-search', text: 'Buscar' },
      { icon: 'ic-grid', text: 'Todos', isSelected: true },
      { icon: 'ic-family', text: 'Familia', isEditable: true },
      { icon: 'ic-baby-stroller', text: 'Bebé', isEditable: true },
      { icon: 'ic-edit', text: 'Editar' }
    ];
    function Interactive() {
      var st = React.useState(1);
      var items = homeItems.map(function (it, i) {
        return Object.assign({}, it, { isSelected: i === st[0] });
      });
      return phone(h(C, { items: items, onSelect: st[1] }));
    }
    var variants = [
      ['home · «Todos» seleccionado (scroll horizontal)', phone(h(C, { items: homeItems }))],
      ['showEditIcon · carpetas editables (badge lápiz)', phone(h(C, { items: homeItems, showEditIcon: true }))],
      ['interactive · onSelect', h(Interactive)],
      ['children · BtnFolder extra no expandible (+)', phone(h(C, {
        items: homeItems.slice(1, 4)
      }, h(NS.BtnFolder, { icon: 'ic-add', isNonExpandable: true, iconSelectedColor: '#3E9ACB', onClick: noop })))],
      ['dark · home + showEditIcon', phone(h(C, { items: homeItems, showEditIcon: true })), true]
    ];
    var g = document.getElementById('g');
    variants.forEach(function (v) {
      var cell = document.createElement('div'); cell.className = 'ds-cell';
      var t = document.createElement('h4'); t.textContent = v[0]; cell.appendChild(t);
      var m = document.createElement('div'); cell.appendChild(m); g.appendChild(cell);
      if (v[2]) { m.setAttribute('data-theme', 'dark'); m.style.background = 'var(--bg-base)'; m.style.padding = '12px'; m.style.borderRadius = '8px'; }
      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
  </script>
</body></html>
