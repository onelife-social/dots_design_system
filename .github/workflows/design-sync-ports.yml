# Avisa cuando una PR añade un widget nuevo en lib/src/components/ sin su port
# web en tool/design_sync/_src/. Cada componente tiene dos mitades: la Flutter
# (la que usa la app) y el port React que consume el design system de
# claude.ai/design. Si solo llega la primera, el design system se desincroniza
# en silencio y los diseños no pueden montar ese componente.
#
# Escapes: label design-sync:skip, o declarar el widget en
# tool/design_sync/.port-exceptions.json (ignore / aliases).
name: Design sync ports

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches: [develop]
    paths:
      - 'lib/src/components/**'

permissions:
  contents: read

jobs:
  check-ports:
    runs-on: ubuntu-latest
    if: "!contains(join(github.event.pull_request.labels.*.name, ','), 'design-sync:skip')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archivos .dart NUEVOS bajo lib/src/components/
        id: added
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --diff-filter=A --name-only "$BASE_SHA" "$HEAD_SHA" -- 'lib/src/components/**/*.dart' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Nuevos: ${files:-(ninguno)}"

      - name: Comprobar que cada widget nuevo tiene su port web
        run: node tool/design_sync/check-ports.mjs ${{ steps.added.outputs.files }}
