<!-- @dsCard group="inputs" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../_ds_bundle.css">
  <style>
    body{margin:0;padding:24px;background:var(--bg-base)}
    .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
    .ds-cell{border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-width:0;overflow:hidden;transform:translateZ(0)}
    .ds-cell>h4{margin:0 0 8px;font:600 12px system-ui;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
  </style>
</head><body>
  <div class="ds-grid" id="g"></div>
  <script src="../../../_vendor/react.js"></script>
  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.DotsSegmentedControl;
    var variants = [
      ['text · main · left', h(C, { leftOptionName: 'Fotos', rightOptionName: 'Vídeos', defaultSelectedOption: 'left' })],
      ['text · main · right + rightOptionTag', h(C, { leftOptionName: 'Míos', rightOptionName: 'Compartidos', rightOptionTag: '3', defaultSelectedOption: 'right' })],
      ['text · camera', h(C, { leftOptionName: 'Foto', rightOptionName: 'Vídeo', variant: 'camera', defaultSelectedOption: 'left' })],
      ['icon · left / right', h('div', { style: { display: 'flex', gap: '16px' } },
        h(C, { type: 'icon', leftOptionIcon: 'ic-camera', rightOptionIcon: 'ic-gallery', defaultSelectedOption: 'left' }),
        h(C, { type: 'icon', leftOptionIcon: 'ic-camera', rightOptionIcon: 'ic-gallery', defaultSelectedOption: 'right' }))],
      ['single + buttonTag', h('div', { style: { display: 'flex', gap: '16px' } },
        h(C, { type: 'single', buttonName: 'Todos' }),
        h(C, { type: 'single', buttonName: 'Recientes', buttonTag: '5' }))],
      ['dark — text / icon / single', h('div', { style: { display: 'flex', gap: '16px', flexWrap: 'wrap', alignItems: 'center' } },
        h(C, { leftOptionName: 'Fotos', rightOptionName: 'Vídeos', defaultSelectedOption: 'left' }),
        h(C, { type: 'icon', leftOptionIcon: 'ic-camera', rightOptionIcon: 'ic-gallery', defaultSelectedOption: 'left' }),
        h(C, { type: 'single', buttonName: 'Todos' })), 'dark']
    ];
    var g = document.getElementById('g');
    variants.forEach(function (v) {
      var cell = document.createElement('div'); cell.className = 'ds-cell';
      var t = document.createElement('h4'); t.textContent = v[0]; cell.appendChild(t);
      var m = document.createElement('div'); cell.appendChild(m); g.appendChild(cell);
      if (v[2] === 'dark') {
        m.setAttribute('data-theme', 'dark');
        m.style.background = 'var(--bg-base)';
        m.style.padding = '12px';
        m.style.borderRadius = '8px';
      }
      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
  </script>
</body></html>
