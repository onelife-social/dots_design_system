name: dots_design_system
description: "A new Flutter project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.9.0
  flutter: ">=3.27.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.1
  soft_edge_blur: ^0.1.3
  figma_squircle: ^0.6.3
  flutter_shaders: ^0.1.3
  transparent_image: ^2.0.1
  gradient_progress_indicator: ^1.0.0+5
  vector_graphics: ^1.1.19
  animate_do: ^4.2.0
  visibility_detector: 0.4.0+2
  easy_debounce: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  vector_graphics_compiler: ^1.1.19

flutter:
  assets:
    - assets/icons/album/
    - assets/icons/arrow/
    - assets/icons/editing_tools/
    - assets/icons/media/
    - assets/icons/premium/
    - assets/icons/social/
    - assets/icons/system/
    - assets/icons/home/
    - assets/images/
    - assets/images/icons/
    - assets/images/social_media/
    - assets/images/milestones/
    - assets/images/dotbook/
    - assets/images/dotbook/bubble/

  # Shaders
  shaders:
    - assets/shaders/blur.frag
    - assets/shaders/progressive_blur.frag
  # Fonts
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito-Regular.ttf
          weight: 400
          style: normal
        - asset: assets/fonts/nunito/Nunito-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/nunito/Nunito-Medium.ttf
          weight: 500
          style: normal
        - asset: assets/fonts/nunito/Nunito-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/nunito/Nunito-SemiBold.ttf
          weight: 600
          style: normal
        - asset: assets/fonts/nunito/Nunito-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/nunito/Nunito-Bold.ttf
          weight: 700
          style: normal
        - asset: assets/fonts/nunito/Nunito-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/nunito/Nunito-ExtraBold.ttf
          weight: 800
          style: normal
        - asset: assets/fonts/nunito/Nunito-ExtraBoldItalic.ttf
          weight: 800
          style: italic
    - family: P22 Mackinac
      fonts:
        - asset: assets/fonts/p22_mackinac/P22Mackinac-ExtraBold_9.otf
          weight: 800
          style: normal
        - asset: assets/fonts/p22_mackinac/P22Mackinac-ExtraBoldItalic_4.otf
          weight: 800
          style: italic
        - asset: assets/fonts/p22_mackinac/P22Mackinac-Bold_23.otf
          weight: 700
          style: normal
        - asset: assets/fonts/p22_mackinac/P22Mackinac-BoldItalic_7.otf
          weight: 700
          style: italic
        - asset: assets/fonts/p22_mackinac/P22Mackinac-Medium_6.otf
          weight: 500
          style: normal
        - asset: assets/fonts/p22_mackinac/P22Mackinac-MedItalic_22.otf
          weight: 500
          style: italic
        - asset: assets/fonts/p22_mackinac/P22Mackinac-Book_13.otf
          weight: 400
          style: normal
        - asset: assets/fonts/p22_mackinac/P22Mackinac-BookItalic_5.otf
          weight: 400
          style: italic
