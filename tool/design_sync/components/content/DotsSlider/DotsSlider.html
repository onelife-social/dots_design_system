<!-- @dsCard group="content" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../_ds_bundle.css">
  <style>
    body{margin:0;padding:24px;background:var(--bg-base)}
    .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
    .ds-cell{border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-width:0;overflow:hidden;transform:translateZ(0)}
    .ds-cell>h4{margin:0 0 8px;font:600 12px system-ui;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
    .ds-cell .pad{padding:14px 0}
  </style>
</head><body>
  <div class="ds-grid" id="g"></div>
  <script src="../../../_vendor/react.js"></script>
  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.DotsSlider;
    function wrap(el) { return h('div', { className: 'pad' }, el); }
    // Controlado: célula interactiva con estado React
    function Controlled(props) {
      var st = React.useState(props.initial); var v = st[0], setV = st[1];
      return h(C, Object.assign({}, props.rest, { value: v, onChanged: setV }));
    }
    var variants = [
      ['divisions=4 · no controlado', wrap(h(C, { defaultValue: 0.5, divisions: 4 }))],
      ['continuo · no controlado', wrap(h(C, { defaultValue: 0.72, divisions: null }))],
      ['controlado (drag)', wrap(h(Controlled, { initial: 0.25, rest: { divisions: 4 } }))],
      ['max=10 · divisions=10', wrap(h(C, { defaultValue: 3, max: 10, divisions: 10 }))],
      ['iconos custom', wrap(h(C, { defaultValue: 0.4, divisions: null, leftIcon: 'ic-pic', rightIcon: 'ic-pics' }))],
      ['estático (value sin onChanged)', wrap(h(C, { value: 0.6, divisions: 4 }))],
      ['dark — divisions=4 / continuo', h('div', null,
        wrap(h(C, { defaultValue: 0.5, divisions: 4 })),
        wrap(h(C, { defaultValue: 0.72, divisions: null }))), 'dark']
    ];
    var g = document.getElementById('g');
    variants.forEach(function (v) {
      var cell = document.createElement('div'); cell.className = 'ds-cell';
      var t = document.createElement('h4'); t.textContent = v[0]; cell.appendChild(t);
      var m = document.createElement('div'); cell.appendChild(m); g.appendChild(cell);
      if (v[2] === 'dark') {
        m.setAttribute('data-theme', 'dark');
        m.style.background = 'var(--bg-base)';
        m.style.padding = '12px';
        m.style.borderRadius = '8px';
      }
      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
  </script>
</body></html>
