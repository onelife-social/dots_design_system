<!-- @dsCard group="content" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../_ds_bundle.css">
  <style>
    body{margin:0;padding:24px;background:var(--bg-base)}
    .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
    .ds-cell{border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-width:0;overflow:hidden;transform:translateZ(0)}
    .ds-cell>h4{margin:0 0 8px;font:600 12px system-ui;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
  </style>
</head><body>
  <div class="ds-grid" id="g"></div>
  <script src="../../../_vendor/react.js"></script>
  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.DotsListItem;
    function grad(a, b) {
      return 'data:image/svg+xml,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="' + a + '"/><stop offset="1" stop-color="' + b + '"/></linearGradient></defs>' +
        '<rect width="80" height="80" fill="url(#g)"/></svg>');
    }
    var photoA = grad('#A9C3DB', '#E4D3BE'), photoB = grad('#D8B8C8', '#B8C8D8'),
        photoC = grad('#C8D8B8', '#A9C3DB'), avatar = grad('#E8C9A9', '#C9A9E8');
    var variants = [
      ['main · album', h(C, { variant: 'main', label: 'Álbum de verano', imageSrc: photoA })],
      ['main · user', h(C, { variant: 'main', label: 'María González', imageSrc: avatar, picType: 'user' })],
      ['icon', h(C, { variant: 'icon', label: 'Invitar amigos', iconName: 'ic-user' })],
      ['selector', h(C, { variant: 'selector', label: 'Viaje a Lisboa', imageSrc: photoB })],
      ['radioButton', h(C, { variant: 'radioButton', label: 'Cumpleaños de Ana', imageSrc: photoC })],
      ['check', h(C, { variant: 'check', label: 'Recuerdos 2024', imageSrc: photoA })],
      ['divider', h(C, { variant: 'divider', label: 'Compartidos contigo' })],
      ['label largo (ellipsis)', h(C, { variant: 'main', label: 'Un nombre de álbum larguísimo que no cabe y se corta con puntos suspensivos', imageSrc: photoB })],
      ['dark — main / radioButton / divider', h('div', { style: { display: 'flex', flexDirection: 'column', gap: '14px' } },
        h(C, { variant: 'main', label: 'Álbum de verano', imageSrc: photoA }),
        h(C, { variant: 'radioButton', label: 'Cumpleaños de Ana', imageSrc: photoC }),
        h(C, { variant: 'divider', label: 'Compartidos contigo' })), 'dark']
    ];
    var g = document.getElementById('g');
    variants.forEach(function (v) {
      var cell = document.createElement('div'); cell.className = 'ds-cell';
      var t = document.createElement('h4'); t.textContent = v[0]; cell.appendChild(t);
      var m = document.createElement('div'); cell.appendChild(m); g.appendChild(cell);
      if (v[2] === 'dark') {
        m.setAttribute('data-theme', 'dark');
        m.style.background = 'var(--bg-base)';
        m.style.padding = '12px';
        m.style.borderRadius = '8px';
      }
      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
  </script>
</body></html>
