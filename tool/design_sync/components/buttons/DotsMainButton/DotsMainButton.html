<!-- @dsCard group="buttons" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../_ds_bundle.css">
  <style>
    body{margin:0;padding:24px;background:var(--bg-base)}
    .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
    .ds-cell{border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-width:0;overflow:hidden;transform:translateZ(0)}
    .ds-cell>h4{margin:0 0 8px;font:600 12px system-ui;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
  </style>
</head><body>
  <div class="ds-grid" id="g"></div>
  <script src="../../../_vendor/react.js"></script>
  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.DotsMainButton;
    function row() {
      return h('div', { style: { display: 'flex', gap: '10px', flexWrap: 'wrap', alignItems: 'center' } },
        Array.prototype.slice.call(arguments));
    }
    var variants = [
      ['sizes (variant main)', row(
        h(C, { label: 'Main action · 52', size: 'mainAction', expand: false }),
        h(C, { label: 'Large · 44', size: 'large', expand: false }),
        h(C, { label: 'Medium · 36', size: 'medium', expand: false }),
        h(C, { label: 'Small · 28', size: 'small', expand: false })
      )],
      ['main · icon + details', row(
        h(C, { label: 'Continuar', details: '2/3', icon: 'ic-check', expand: false }),
        h(C, { label: 'Siguiente', icon: 'ic-arrow-right', iconPosition: 'right', expand: false })
      )],
      ['secondary / secondaryLight / secondaryDark (blur)', row(
        h(C, { label: 'secondary', variant: 'secondary', shouldApplyBlur: true, expand: false }),
        h(C, { label: 'secondaryLight', variant: 'secondaryLight', shouldApplyBlur: true, expand: false }),
        h(C, { label: 'secondaryDark', variant: 'secondaryDark', shouldApplyBlur: true, expand: false })
      )],
      ['surface / surfacePremium / surfacePremiumPlus', row(
        h(C, { label: 'surface', variant: 'surface', shouldApplyBlur: true, expand: false }),
        h(C, { label: 'surfacePremium', variant: 'surfacePremium', icon: 'ic-diamond', expand: false }),
        h(C, { label: 'surfacePremiumPlus', variant: 'surfacePremiumPlus', expand: false })
      )],
      ['destructive / ghost', row(
        h(C, { label: 'Eliminar', variant: 'destructive', icon: 'ic-trash', expand: false }),
        h(C, { label: 'Ghost', variant: 'ghost', expand: false })
      )],
      ['enabled:false → disabled / disabledOpaque', row(
        h(C, { label: 'Deshabilitado', enabled: false, expand: false }),
        h(C, { label: 'Opaco', enabled: false, disabledVariant: 'disabledOpaque', expand: false })
      )],
      ['premium · mainAction (fondo degradado)', row(
        h(C, { label: 'Hazte premium', variant: 'premium', size: 'mainAction', icon: 'ic-diamond', expand: false }),
        h(C, { label: 'Premium Plus', variant: 'premiumPlus', size: 'mainAction', expand: false })
      )],
      ['premium · large (texto degradado + blur)', row(
        h(C, { label: 'Premium', variant: 'premium', shouldApplyBlur: true, expand: false }),
        h(C, { label: 'Premium Plus', variant: 'premiumPlus', shouldApplyBlur: true, expand: false })
      )],
      ['secondaryPremium / secondaryPremiumPlus', row(
        h(C, { label: 'secondaryPremium', variant: 'secondaryPremium', icon: 'ic-diamond', expand: false }),
        h(C, { label: 'secondaryPremiumPlus', variant: 'secondaryPremiumPlus', expand: false })
      )],
      ['isLoading', row(
        h(C, { label: 'Cargando', isLoading: true, expand: false }),
        h(C, { label: 'Cargando', variant: 'premium', size: 'mainAction', isLoading: true, expand: false })
      )],
      ['dark', row(
        h(C, { label: 'Continuar', expand: false }),
        h(C, { label: 'secondary', variant: 'secondary', shouldApplyBlur: true, expand: false }),
        h(C, { label: 'Premium', variant: 'premium', shouldApplyBlur: true, expand: false }),
        h(C, { label: 'Deshabilitado', enabled: false, expand: false })

    var g = document.getElementById('g');
    variants.forEach(function (v) {
      var cell = document.createElement('div'); cell.className = 'ds-cell';
      var t = document.createElement('h4'); t.textContent = v[0]; cell.appendChild(t);
      var m = document.createElement('div'); cell.appendChild(m); g.appendChild(cell);
      if (v[2]) {
        m.setAttribute('data-theme', 'dark');
        m.style.background = 'var(--bg-base)';
        m.style.padding = '12px';
        m.style.borderRadius = '6px';

      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
  </script>
</body></html>
