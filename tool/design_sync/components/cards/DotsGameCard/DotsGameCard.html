<!-- @dsCard group="cards" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../_ds_bundle.css">
  <style>
    body{margin:0;padding:24px;background:var(--bg-base)}
    .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px;align-items:start}
    .ds-cell{border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-width:0;overflow:hidden;transform:translateZ(0)}
    .ds-cell>h4{margin:0 0 8px;font:600 12px system-ui;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
  </style>
</head><body>
  <div class="ds-grid" id="g"></div>
  <script src="../../../_vendor/react.js"></script>
  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.DotsGameCard;

    // Artwork de ejemplo (la story usa Image.network con BoxFit.contain)
    var ART = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 138 100">' +
      '<defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#8C84F7"/><stop offset="1" stop-color="#C17FFA"/>' +
      '</linearGradient></defs>' +
      '<rect x="19" y="4" width="100" height="92" rx="20" fill="url(#a)"/>' +
      '<circle cx="69" cy="41" r="15" fill="rgba(255,255,255,.92)"/>' +
      '<rect x="47" y="64" width="44" height="7" rx="3.5" fill="rgba(255,255,255,.8)"/>' +
      '<rect x="55" y="77" width="28" height="7" rx="3.5" fill="rgba(255,255,255,.55)"/>' +
      '</svg>');

    var DESC_PROC = 'Estamos terminando de preparar vuestro acceso. En unos segundos podréis configurarlo';

    var variants = [
      ['active · badge greenMaterial + DotsMainButton large', h(C, {
        status: 'active', imageSrc: ART, badgeText: 'ACTIVO',
        title: 'La Misión Secreta',
        description: 'Retos sorpresa para cada invitado durante toda la celebración',
        actionText: 'Ir al panel', onActionClick: function () {},
      })],
      ['processing · badge secondary + indicador (no se pulsa)', h(C, {
        status: 'processing', imageSrc: ART, badgeText: 'PREPARANDO',
        title: 'La Misión Secreta', description: DESC_PROC,
        actionText: 'Preparando tu acceso…', onActionClick: function () {},
      })],
      ['error · badge warningMaterial', h(C, {
        status: 'error', imageSrc: ART, badgeText: 'NO DISPONIBLE',
        title: 'El Confesionario',
        description: 'No hemos podido activar el juego. Escríbenos y lo resolvemos',
        actionText: 'Contactar con soporte', onActionClick: function () {},
      })],
      ['sin imageSrc (placeholder)', h(C, {
        status: 'active', badgeText: 'ACTIVO', title: 'El Confesionario',
        description: 'Tus invitados, con sus propias palabras',
        actionText: 'Ir al panel', onActionClick: function () {},
      })],
      ['processing · image + progressIndicator propios (slots de Dart)', h(C, {
        status: 'processing', badgeText: 'PREPARANDO', title: 'Pack Boda',
        description: DESC_PROC, actionText: 'Un momento…',
        image: h('div', { style: { width: '100%', height: '100%', borderRadius: '20px',
          background: 'linear-gradient(140deg,#E9C058,#B48D2D)' } }),
        // El host pasa su propio indicador (aquí, el anillo del DS teñido de verde)
        progressIndicator: h('span', {
          className: 'ds-game-card__spinner',
          style: { borderTopColor: 'var(--label-active)' },
        }),
      })],
      ['dark — active / processing', h('div', {
          'data-theme': 'dark',
          style: { display: 'flex', flexDirection: 'column', gap: '16px', background: 'var(--bg-base)', padding: '16px', borderRadius: '12px' },
        }, [
          h(C, { key: 'a', status: 'active', imageSrc: ART, badgeText: 'ACTIVO',
            title: 'La Misión Secreta', description: 'Retos sorpresa para cada invitado',
            actionText: 'Ir al panel', onActionClick: function () {} }),
          h(C, { key: 'p', status: 'processing', imageSrc: ART, badgeText: 'PREPARANDO',
            title: 'La Misión Secreta', description: DESC_PROC, actionText: 'Preparando tu acceso…' }),
        ])],
    ];

    var g = document.getElementById('g');
    variants.forEach(function (v) {
      var cell = document.createElement('div'); cell.className = 'ds-cell';
      var t = document.createElement('h4'); t.textContent = v[0]; cell.appendChild(t);
      var m = document.createElement('div'); cell.appendChild(m); g.appendChild(cell);
      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
  </script>
</body></html>
