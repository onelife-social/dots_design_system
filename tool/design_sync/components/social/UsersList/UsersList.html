<!-- @dsCard group="social" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../_ds_bundle.css">
  <style>
    body{margin:0;padding:24px;background:var(--bg-base)}
    .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
    .ds-cell{border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-width:0;overflow:hidden;transform:translateZ(0)}
    .ds-cell>h4{margin:0 0 8px;font:600 12px system-ui;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
  </style>
</head><body>
  <div class="ds-grid" id="g"></div>
  <script src="../../../_vendor/react.js"></script>
  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.UsersList;
    var members = [
      { id: '1', name: 'Jose', memberType: 'creator' },
      { id: '2', name: 'María', memberType: 'admin' },
      { id: '3', name: 'Carlos', memberType: 'friend' },
      { id: '4', name: 'Lucía', memberType: 'member' },
      { id: '5', name: 'Pablo', alias: 'P', memberType: 'existingAlias' },
      { id: '6', name: '', memberType: 'alias' }
    ];
    var noop = function () {};
    var variants = [
      ['UsersList · variantes por memberType', h(C, {
        members: members, creatorLabel: 'Creador', adminLabel: 'Admin',
        canModifyMembers: true, memberOnClick: noop, textOnChange: noop, autofocusOnEmpty: false,
        textfieldLabel: 'Nombre del participante',
        addParticipantLabel: 'Añadir participante', addParticipantOnClick: noop,
        showAddFriendButton: true, addFriendLabel: 'Añadir amigo', addFriendOnClick: noop
      })],
      ['Item · waiting / pendingMember (large)', h('div', { className: 'ds-users-list' },
        h(C.Item, { variant: 'waiting', id: 'w1', name: 'Sara Ruiz', details: 'Invitación enviada' }),
        h(C.Item, {
          variant: 'pendingMember', id: 'p1', name: 'Diego Martín', details: '@diegom',
          buttonLabel1: 'Aceptar', buttonLabel2: 'Rechazar', onButton1Click: noop, onButton2Click: noop
        })
      )],
      ['Item · pending / basic', h('div', { className: 'ds-users-list' },
        h(C.Item, { variant: 'pending', id: 'p2', name: 'Nuria', onClick: noop }),
        h(C.Item, { variant: 'basic', id: 'b1', name: 'Elena' })
      )],
      ['dark', h(C, {
        members: members.slice(0, 4), creatorLabel: 'Creador', adminLabel: 'Admin',
        canModifyMembers: true, memberOnClick: noop,
        addParticipantLabel: 'Añadir participante', addParticipantOnClick: noop
      }), 'dark']
    ];
    var g = document.getElementById('g');
    variants.forEach(function (v) {
      var cell = document.createElement('div'); cell.className = 'ds-cell';
      var t = document.createElement('h4'); t.textContent = v[0]; cell.appendChild(t);
      var m = document.createElement('div');
      if (v[2] === 'dark') { m.setAttribute('data-theme', 'dark'); m.style.background = 'var(--bg-base)'; m.style.padding = '12px'; m.style.borderRadius = '6px'; }
      cell.appendChild(m); g.appendChild(cell);
      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
  </script>
</body></html>
