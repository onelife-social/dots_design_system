<!-- @dsCard group="cards" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../_ds_bundle.css">
  <style>
    body{margin:0;padding:24px;background:var(--bg-base)}
    .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
    .ds-cell{border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-width:0;overflow:hidden;transform:translateZ(0)}
    .ds-cell>h4{margin:0 0 8px;font:600 12px system-ui;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
  </style>
</head><body>
  <div class="ds-grid" id="g"></div>
  <script src="../../../_vendor/react.js"></script>
  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.CreateCard;
    function row() {
      return h('div', { style: { display: 'flex', gap: '16px', flexWrap: 'wrap', alignItems: 'flex-start' } },
        Array.prototype.slice.call(arguments));
    }
    var variants = [
      ['label · degradado por props', row(
        h(C, { title: 'Primer viaje juntos', icon: 'ic-pic', primaryColor: '#77D98A', secondaryColor: '#28AB87' }),
        h(C, { title: 'Nuestra boda', icon: 'ic-wedding-rings', primaryColor: '#C88EFF', secondaryColor: '#8B84F7' })
      )],
      ['label · sin colores (fallback verde)', h(C, { title: 'Un día en familia', icon: 'ic-family' })],
      ['button · crear recuerdo', h(C, { variant: 'button', title: 'Crear recuerdo' })],
      ['width personalizado (200)', h(C, { title: 'Vacaciones en la playa', icon: 'ic-ship', width: 200, primaryColor: '#15ABF3', secondaryColor: '#3478F6' })],
      ['dark', row(
        h(C, { title: 'Primer viaje juntos', icon: 'ic-pic', primaryColor: '#77D98A', secondaryColor: '#28AB87' }),
        h(C, { variant: 'button', title: 'Crear recuerdo' })
      ), true]
    ];
    var g = document.getElementById('g');
    variants.forEach(function (v) {
      var cell = document.createElement('div'); cell.className = 'ds-cell';
      var t = document.createElement('h4'); t.textContent = v[0]; cell.appendChild(t);
      var m = document.createElement('div'); cell.appendChild(m); g.appendChild(cell);
      if (v[2]) {
        m.setAttribute('data-theme', 'dark');
        m.style.background = 'var(--bg-base)';
        m.style.padding = '12px';
        m.style.borderRadius = '6px';
      }
      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
  </script>
</body></html>
