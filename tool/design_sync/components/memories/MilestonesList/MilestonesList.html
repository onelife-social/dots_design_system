<!-- @dsCard group="memories" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../_ds_bundle.css">
  <style>
    body{margin:0;padding:24px;background:var(--bg-base)}
    .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;align-items:start}
    .ds-cell{border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-width:0;overflow:hidden;transform:translateZ(0)}
    .ds-cell>h4{margin:0 0 8px;font:600 12px system-ui;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
    .scroll{max-height:560px;overflow-y:auto}
  </style>
</head><body>
  <div class="ds-grid" id="g"></div>
  <script src="../../../_vendor/react.js"></script>
  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.MilestonesList;
    var demoSrc = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400">' +
      '<defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#C9D6C3"/><stop offset=".5" stop-color="#E4D6BE"/>' +
      '<stop offset="1" stop-color="#A9B7C0"/></linearGradient></defs>' +
      '<rect width="300" height="400" fill="url(#a)"/>' +
      '<circle cx="90" cy="290" r="60" fill="#FFFFFF55"/>' +
      '<circle cx="210" cy="150" r="90" fill="#FFFFFF33"/></svg>');
    var demoSrc2 = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400">' +
      '<defs><linearGradient id="b" x1="0" y1="1" x2="1" y2="0">' +
      '<stop offset="0" stop-color="#D8C4C9"/><stop offset=".6" stop-color="#C4CBD8"/>' +
      '<stop offset="1" stop-color="#E0D6C2"/></linearGradient></defs>' +
      '<rect width="300" height="400" fill="url(#b)"/>' +
      '<circle cx="220" cy="300" r="70" fill="#FFFFFF44"/></svg>');
    function scroll(el) { return h('div', { className: 'scroll' }, el); }
    var timeline = [
      '6 meses',
      { src: demoSrc, title: 'Primeros pasos', date: '12 mar 2026', badgeTypes: ['video'] },
      { src: demoSrc2, title: 'Su primer diente', showBadge: true },
      '12 meses',
      { src: demoSrc, title: 'Primera palabra', date: '2 jun 2026', badgeTypes: ['audio', 'description'] }
    ];
    var variants = [
      ['badges + cards (seed 7) — scroll interno', scroll(h(C, { list: timeline, seed: 7 }))],
      ['mismo list, seed 3 (otro trazado x)', scroll(h(C, { list: timeline, seed: 3 }))],
      ['solo cards (gaps aleatorios 20–34)', scroll(h(C, {
        seed: 1,
        list: [
          { src: demoSrc, title: 'Primeros pasos' },
          { src: demoSrc2, title: 'Su primer diente' },
          { src: demoSrc, title: 'Primera palabra' }
        ]
      }))],
      ['dark · badges + cards', scroll(h(C, { list: timeline, seed: 7 })), true]
    ];
    var g = document.getElementById('g');
    variants.forEach(function (v) {
      var cell = document.createElement('div'); cell.className = 'ds-cell';
      var t = document.createElement('h4'); t.textContent = v[0]; cell.appendChild(t);
      var m = document.createElement('div'); cell.appendChild(m); g.appendChild(cell);
      if (v[2]) { m.setAttribute('data-theme', 'dark'); m.style.background = 'var(--bg-base)'; m.style.padding = '12px'; m.style.borderRadius = '8px'; }
      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
  </script>
</body></html>
