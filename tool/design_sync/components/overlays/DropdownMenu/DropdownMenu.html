<!-- @dsCard group="overlays" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../_ds_bundle.css">
  <style>
    body{margin:0;padding:24px;background:var(--bg-base)}
    .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
    .ds-cell{border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-width:0;overflow:hidden;transform:translateZ(0)}
    .ds-cell>h4{margin:0 0 8px;font:600 12px system-ui;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
    .tall{min-height:210px}
  </style>
</head><body>
  <div class="ds-grid" id="g"></div>
  <script src="../../../_vendor/react.js"></script>
  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.DropdownMenu;
    var noop = function () {};
    var items = [
      { text: 'Editar recuerdo', icon: 'ic-edit', onClick: noop },
      { text: 'Compartir', subtitle: 'con familia', icon: 'ic-share', onClick: noop },
      { text: 'Eliminar', icon: 'ic-trash', destructive: true, onClick: noop },
    ];
    var variants = [
      ['botones small / medium / active / onBackground',
        h('div', { style: { display: 'flex', gap: '10px', flexWrap: 'wrap', alignItems: 'flex-start' } },
          h(C, { label: 'Mes', subtitle: 'marzo', items: items }),
          h(C, { label: 'Ordenar por', size: 'medium', items: items }),
          h('div', { style: { background: '#30303099', padding: '10px', borderRadius: '10px' } },
            h(C, { label: 'Filtrar', variant: 'onBackground', items: items })))],
      ['menú (solo panel)', h(C, { items: items })],
      ['abierto (isActive)', h('div', { className: 'tall' },
        h(C, { label: 'Año', subtitle: '2026', isActive: true, items: items }))],
      ['menú · dark', h(C, { items: items }), 'dark'],
      ['abierto · dark', h('div', { className: 'tall' },
        h(C, { label: 'Año', subtitle: '2026', isActive: true, items: items })), 'dark'],
    ];
    var g = document.getElementById('g');
    variants.forEach(function (v) {
      var cell = document.createElement('div'); cell.className = 'ds-cell';
      var t = document.createElement('h4'); t.textContent = v[0]; cell.appendChild(t);
      var m = document.createElement('div'); cell.appendChild(m); g.appendChild(cell);
      if (v[2] === 'dark') { m.setAttribute('data-theme', 'dark'); m.style.background = 'var(--bg-base)'; m.style.padding = '12px'; m.style.borderRadius = '6px'; }
      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
  </script>
</body></html>
