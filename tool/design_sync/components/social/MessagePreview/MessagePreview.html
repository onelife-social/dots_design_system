<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../_ds_bundle.css">
  <style>
    body{margin:0;padding:24px;background:var(--bg-base)}
    .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
    .ds-cell{border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-width:0;overflow:hidden;transform:translateZ(0)}
    .ds-cell>h4{margin:0 0 8px;font:600 12px system-ui;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
  </style>
</head><body>
  <div class="ds-grid" id="g"></div>
  <script src="../../../_vendor/react.js"></script>
  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.MessagePreview;
    var variants = [
      ['message + newMessages', h(C, {
        album: 'Verano en familia', senderName: 'Ana', time: '14:32', newMessages: 3,
        message: '¡Qué ganas de ver las fotos del viaje! Subid las del sábado cuando podáis.',
        onClick: function () {}
      })],
      ['typingText', h(C, {
        album: 'Amigos de siempre', time: 'Ayer', newMessages: 0,
        message: '', typingText: 'Marta está escribiendo…'
      })],
      ['attachmentType: image · +999', h(C, {
        album: 'Boda de Lucía', senderName: 'Pablo', time: 'Lun', newMessages: 1200,
        message: 'Foto', attachmentType: 'image'
      })],
      ['attachmentType: audio', h(C, {
        album: 'Familia García', senderName: 'Marta', time: 'Dom', newMessages: 1,
        message: 'Audio', attachmentType: 'audio'
      })],
      ['dark', h('div', null,
        h(C, { album: 'Verano en familia', senderName: 'Ana', time: '14:32', newMessages: 3, message: '¡Qué ganas de ver las fotos del viaje!' }),
        h(C, { album: 'Amigos de siempre', time: 'Ayer', newMessages: 0, message: '', typingText: 'Marta está escribiendo…' })
      ), 'dark']
    ];
    var g = document.getElementById('g');
    variants.forEach(function (v) {
      var cell = document.createElement('div'); cell.className = 'ds-cell';
      var t = document.createElement('h4'); t.textContent = v[0]; cell.appendChild(t);
      var m = document.createElement('div');
      if (v[2] === 'dark') { m.setAttribute('data-theme', 'dark'); m.style.background = 'var(--bg-base)'; m.style.padding = '12px'; m.style.borderRadius = '6px'; }
      cell.appendChild(m); g.appendChild(cell);
      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
  </script>
</body></html>
