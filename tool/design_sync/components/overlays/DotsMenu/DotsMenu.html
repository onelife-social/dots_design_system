<!-- @dsCard group="overlays" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../_ds_bundle.css">
  <style>
    body{margin:0;padding:24px;background:var(--bg-base)}
    .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
    .ds-cell{border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-width:0;overflow:hidden;transform:translateZ(0)}
    .ds-cell>h4{margin:0 0 8px;font:600 12px system-ui;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
  </style>
</head><body>
  <div class="ds-grid" id="g"></div>
  <script src="../../../_vendor/react.js"></script>
  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.DotsMenu;
    var noop = function () {};
    var subitems = [
      { id: 'all', label: 'Todos los recuerdos', selected: true, onClick: noop },
      { id: 'edit', label: 'Editar título', details: 'Cambia el nombre visible', icon: 'ic-edit', onClick: noop },
      { id: 'sort', label: 'Ordenar por', addDivider: true, subItems: [
        { id: 'sort-date', label: 'Fecha', onClick: noop },
        { id: 'sort-name', label: 'Nombre', onClick: noop },
      ] },
      { id: 'delete', label: 'Eliminar dot', isDelete: true, icon: 'ic-trash', onClick: noop },
    ];
    var settingsItems = [
      { variant: 'icon', label: 'Recordatorios diarios', startIcon: 'ic-bell', endIcon: 'ic-chevron-right', onClick: noop },
      { variant: 'toggle', label: 'Actividad de amigos', startIcon: 'ic-user', toggleValue: true, onToggleTap: noop },
      { variant: 'toggle', label: 'Novedades', startIcon: 'ic-notification', toggleValue: false, onToggleTap: noop },
    ];
    var variants = [
      ['mainItem + subitems', h(C, { mainItem: { id: 'root', label: 'Opciones del dot' }, subitems: subitems })],
      ['navegación anidada (defaultSelectedItemId)', h(C, {
        mainItem: { id: 'root', label: 'Opciones del dot' },
        subitems: subitems,
        defaultSelectedItemId: 'sort-date',
      })],
      ['SettingsList', h(C.SettingsList, {
        title: 'Notificaciones',
        description: 'Puedes cambiar esto más tarde en Ajustes.',
        items: settingsItems,
      })],
      ['menu · dark', h(C, { mainItem: { id: 'root', label: 'Opciones del dot' }, subitems: subitems }), 'dark'],
      ['SettingsList · dark', h(C.SettingsList, {
        title: 'Notificaciones',
        description: 'Puedes cambiar esto más tarde en Ajustes.',
        items: settingsItems,
      }), 'dark'],
    ];
    var g = document.getElementById('g');
    variants.forEach(function (v) {
      var cell = document.createElement('div'); cell.className = 'ds-cell';
      var t = document.createElement('h4'); t.textContent = v[0]; cell.appendChild(t);
      var m = document.createElement('div'); cell.appendChild(m); g.appendChild(cell);
      if (v[2] === 'dark') { m.setAttribute('data-theme', 'dark'); m.style.background = 'var(--bg-base)'; m.style.padding = '12px'; m.style.borderRadius = '6px'; }
      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
  </script>
</body></html>
