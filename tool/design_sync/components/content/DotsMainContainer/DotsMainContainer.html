<!-- @dsCard group="content" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../_ds_bundle.css">
  <style>
    body{margin:0;padding:24px;background:var(--bg-base)}
    .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
    .ds-cell{border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-width:0;overflow:hidden;transform:translateZ(0)}
    .ds-cell>h4{margin:0 0 8px;font:600 12px system-ui;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
  </style>
</head><body>
  <div class="ds-grid" id="g"></div>
  <script src="../../../_vendor/react.js"></script>
  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.DotsMainContainer;
    function row() {
      return h('div', { style: { display: 'flex', gap: '10px', flexWrap: 'wrap', alignItems: 'flex-start' } },
        Array.prototype.slice.call(arguments));
    }
    function label(t) { return h('span', { style: { font: '400 10px ui-monospace, monospace', color: 'var(--text-secondary)' } }, t); }
    var variants = [
      ['variants (h72 → radius 24)', row(
        h(C, { variant: 'main', width: 118, height: 72 }, label('main')),
        h(C, { variant: 'secondary', width: 118, height: 72 }, label('secondary')),
        h(C, { variant: 'onBackground', width: 118, height: 72 }, label('onBackground')),
        h(C, { variant: 'tertiary', width: 118, height: 72 }, label('tertiary'))
      )],
      ['h > 100 → radius 32', row(
        h(C, { variant: 'main', width: 160, height: 120 }, label('main · r32')),
        h(C, { variant: 'secondary', width: 160, height: 120, radius: 16 }, label('radius 16'))
      )],
      ['forceHeight:false + children (alto intrínseco)',
        h(C, { variant: 'secondary', forceHeight: false }, label('padding 16 · el contenido marca el alto'))],
      ['backgroundImage + onClick', row(
        h(C, {
          width: 160, height: 120,
          backgroundImage: 'linear-gradient(135deg, #A9C3DB, #E4D3BE)',
          onClick: function () {},
        }, h('span', { style: { font: '600 12px var(--font-main)', color: '#FFF' } }, 'clickable')),
        h(C, { width: 160, height: 120, backgroundColor: 'var(--bg-highlight)' }, label('backgroundColor'))
      )],
      ['dark', row(
        h(C, { variant: 'main', width: 118, height: 72 }, label('main')),
        h(C, { variant: 'secondary', width: 118, height: 72 }, label('secondary')),
        h(C, { variant: 'tertiary', width: 118, height: 72 }, label('tertiary'))
      ), true]
    ];
    var g = document.getElementById('g');
    variants.forEach(function (v) {
      var cell = document.createElement('div'); cell.className = 'ds-cell';
      var t = document.createElement('h4'); t.textContent = v[0]; cell.appendChild(t);
      var m = document.createElement('div'); cell.appendChild(m); g.appendChild(cell);
      if (v[2]) {
        m.setAttribute('data-theme', 'dark');
        m.style.background = 'var(--bg-base)';
        m.style.padding = '12px';
        m.style.borderRadius = '6px';
      }
      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
  </script>
</body></html>
