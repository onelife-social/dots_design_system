<!doctype html>

  </style>
</head><body>
  <div class="ds-grid" id="g"></div>

  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>

    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.BadgeTag;

    }
    var variants = [
      ['standalone', row(
        h(C, { tag: '2' }),
        h(C, { tag: '9' }),
        h(C, { tag: '99+' }),
        h(C, { tag: 'Nuevo' })
      )],
      ['empty (dot 18×18)', row(h(C, { tag: '' }))],

        h(C, { tag: '9' }, NS.BadgeIcon ? h(NS.BadgeIcon, { icon: 'ic-camera' }) : h('span', { style: { display: 'inline-block', width: '44px', height: '44px', borderRadius: '50%', background: '#FFF' } }))
      )],
