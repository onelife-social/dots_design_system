<!-- @dsCard group="indicators" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../_ds_bundle.css">
  <style>
    body{margin:0;padding:24px;background:var(--bg-base)}
    .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
    .ds-cell{border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-width:0;overflow:hidden;transform:translateZ(0)}
    .ds-cell>h4{margin:0 0 8px;font:600 12px system-ui;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
    /* Fondo demo: el spinner vive sobre foto (arco/texto siempre blancos) */
    .spin-demo{padding:14px;border-radius:16px;display:inline-flex;gap:20px;align-items:center;background:linear-gradient(135deg,#33415C,#5A4A42)}
  </style>
</head><body>
  <div class="ds-grid" id="g"></div>
  <script src="../../../_vendor/react.js"></script>
  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.DotsSpinner;
    function demo() { return h('div', { className: 'spin-demo' }, Array.prototype.slice.call(arguments)); }
    function Animated() {
      var st = React.useState(0.15);
      React.useEffect(function () {
        var id = setInterval(function () {
          st[1](function (p) { return p >= 1 ? 0.15 : Math.min(1, p + 0.25); });
        }, 1200);
        return function () { clearInterval(id); };
      }, []);
      return demo(h(C, { progress: st[0] }));
    }
    var variants = [
      ['default · 65% · size 43 · stroke 4', demo(h(C, { progress: 0.65 }), h(C, { progress: 0.25 }))],
      ['showPercentage false', demo(h(C, { progress: 0.65, showPercentage: false }))],
      ['size 60 · stroke 6', demo(h(C, { progress: 0.4, size: 60, strokeWidth: 6 }))],
      ['indeterminate (girando)', demo(h(C, { indeterminate: true }))],
      ['progreso animado (transition)', h(Animated)],
      ['dark · 65% / indeterminate', demo(h(C, { progress: 0.65 }), h(C, { indeterminate: true })), true]
    ];
    var g = document.getElementById('g');
    variants.forEach(function (v) {
      var cell = document.createElement('div'); cell.className = 'ds-cell';
      var t = document.createElement('h4'); t.textContent = v[0]; cell.appendChild(t);
      var m = document.createElement('div'); cell.appendChild(m); g.appendChild(cell);
      if (v[2]) { m.setAttribute('data-theme', 'dark'); m.style.background = 'var(--bg-base)'; m.style.padding = '12px'; m.style.borderRadius = '8px'; }
      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
  </script>
</body></html>
