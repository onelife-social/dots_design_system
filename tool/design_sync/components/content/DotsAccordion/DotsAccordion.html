<!-- @dsCard group="content" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../../../_ds_bundle.css">
  <style>
    body{margin:0;padding:24px;background:var(--bg-base)}
    .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
    .ds-cell{border:1px solid #e5e7eb;border-radius:8px;padding:12px;min-width:0;overflow:hidden;transform:translateZ(0)}
    .ds-cell>h4{margin:0 0 8px;font:600 12px system-ui;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
  </style>
</head><body>
  <div class="ds-grid" id="g"></div>
  <script src="../../../_vendor/react.js"></script>
  <script src="../../../_vendor/react-dom.js"></script>
  <script src="../../../_ds_bundle.js"></script>
  <script>
    var h = React.createElement, NS = window.DotsDesignSystem_9e41da, C = NS.DotsAccordion;
    var lorem = 'Tu álbum se imprime en papel mate de 200 g y se envía en 5–7 días laborables.';
    var sections = [
      { title: 'Detalles del pedido', content: lorem, leadingIcon: 'ic-calendar', expanded: true },
      { title: 'Plazos de entrega', content: 'Entrega estándar en península en 5–7 días laborables.', leadingIcon: 'ic-clock-outline' },
      { title: 'Sin leadingIcon', content: 'Sección sin icono a la izquierda.' }
    ];
    var variants = [
      ['singleOpen (default)', h(C, { sections: sections })],
      ['singleOpen=false', h(C, {
        singleOpen: false,
        sections: [
          { title: 'Primera abierta', content: lorem, expanded: true },
          { title: 'Segunda abierta', content: 'Ambas pueden estar abiertas a la vez.', expanded: true }
        ]
      })],
      ['addHorizontalPadding=false', h(C, { addHorizontalPadding: false, sections: sections.slice(0, 2) })],
      ['animationDuration=600', h(C, { animationDuration: 600, sections: sections.slice(0, 2) })],
      ['dark', h(C, { sections: sections }), 'dark']
    ];
    var g = document.getElementById('g');
    variants.forEach(function (v) {
      var cell = document.createElement('div'); cell.className = 'ds-cell';
      var t = document.createElement('h4'); t.textContent = v[0]; cell.appendChild(t);
      var m = document.createElement('div'); cell.appendChild(m); g.appendChild(cell);
      if (v[2] === 'dark') {
        m.setAttribute('data-theme', 'dark');
        m.style.background = 'var(--bg-base)';
        m.style.padding = '12px';
        m.style.borderRadius = '8px';
      }
      try { ReactDOM.createRoot(m).render(v[1]); } catch (e) { m.textContent = '⚠ ' + e.message; }
    });
  </script>
</body></html>
